.res .big{font-size:15px;color:#0f2342;background:#f8f9fb;border:1px solid #e3e7ed;border-radius:3px;padding:12px 14px;margin-top:18px;text-align:left}
.res .big div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.res .big span{color:#6b788e}
.res .btn{margin-top:22px}.res .btn.ghost{background:#fff;color:#0f2342;border:1px solid #cfd6e0}.res .fine{font-size:13px;color:#6b788e}
</style></head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="/"><span class="logo"><i></i><i></i><i></i><i></i></span>일감마켓</a><nav aria-label="메뉴"><a href="/#win" title="방금 낙찰된 현장과 업체"><span class="em" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span>새 일감</a><a href="/#st" title="지역·공종별 낙찰 현황"><span class="em" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20V10"/></svg></span>통계</a><a href="/#wl" title="담아 둔 업체의 새 낙찰 알림"><span class="em" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg></span>관심 업체</a><a class="sep" href="/market/?c=sell" title="팔고 싶은 물건 올리기"><span class="em" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg></span>내 물건 팔기</a><a href="/market/?c=need" title="필요한 물품 올리고 제안 받기"><span class="em" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg></span>필요한 물품 구해요</a><a class="sep" href="/about.html" title="일감마켓이 시작된 이야기"><span class="em" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M10 21v-4h4v4"/></svg></span>회사 소개</a></nav></div></header>
<main class="wrap"><div class="res" id="res"><h1>결제를 확인하는 중입니다</h1><p>잠시만 기다려 주세요. 이 화면을 닫지 마세요.</p></div></main>
<footer><div class="wrap"><p>상호 겟잇타운 · 대표 신상헌 · 사업자등록번호 594-06-03620 · 통신판매업 신고번호 제2026-용인기흥-01348호 · 사업장 주소 경기도 용인시 기흥구 기흥로116번길 7, 105동 1501호 (신갈동, 새릉골아파트) · 전화 070-8064-8210</p><p>문의 <a href="mailto:help@ilgammarket.co.kr">help@ilgammarket.co.kr</a> · <a href="/market/policy.html#refund">환불규정</a></p></div></footer>
<script src="/pay.js"></script>
<script type="module" src="/auth.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search),res=document.getElementById('res');
  function show(h,p,rows,ok,oid2){
    res.innerHTML='<h1></h1><p></p>'+(rows?'<div class="big">'+rows+'</div>':'')
      +(ok&&oid2?'<a class="btn ghost" target="_blank" rel="noopener" href="/receipt.html?o='+encodeURIComponent(oid2)+'">영수증 보기</a> ':'')
      +'<a class="btn" href="'+(ok?'/#wl':'/pro.html')+'">'+(ok?'지역 알림 설정하기':'일감 마스터 안내로 돌아가기')+'</a>'
      +(ok?'<p class="fine">영수증과 지난 결제 내역은 <a href="/pro.html">일감 마스터 페이지</a>의 \'내 결제 내역\'에서 언제든 다시 볼 수 있습니다.</p>':'');
    res.querySelector('h1').textContent=h;res.querySelector('p').textContent=p;
  }
  function fmt(t){var d=new Date(t);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';}
  if(q.get('code')){show('결제가 완료되지 않았습니다',q.get('message')||'결제가 취소되었거나 실패했습니다. 카드에서 금액이 빠져나가지 않았습니다.');return;}
  var pk=q.get('paymentKey'),oid=q.get('orderId'),amt=q.get('amount');
  if(!pk||!oid||!amt){show('결제 정보가 없습니다','요금 안내 페이지에서 다시 시작해 주세요.');return;}
  var W=window.IGPAY.WORKER,tries=0;
  function go(){
    var A=window.IGAUTH;
    if(!A||!A.ready){if(++tries>60){show('로그인 확인이 늦어지고 있습니다','페이지를 새로고침해 주세요. 결제는 아직 확정되지 않았습니다.');return;}setTimeout(go,250);return;}
    if(!A.user){show('로그인이 필요합니다','로그인한 뒤 요금 안내에서 다시 시도해 주세요. 카드 승인은 확정되지 않아 금액이 빠져나가지 않습니다.');return;}
    A.token().then(function(t){
      return fetch(W+'/confirm',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({paymentKey:pk,orderId:oid,amount:Number(amt)})});
    }).then(function(r){return r.json();}).then(function(d){
      if(!d.ok){show('결제를 확인하지 못했습니다',d.message||'잠시 뒤 다시 시도해 주세요. 문제가 계속되면 help@ilgammarket.co.kr 로 알려 주세요.');return;}
      show('결제가 완료되었습니다','일감 마스터 이용이 시작되었습니다.',
        '<div><span>이용권</span><b>'+(oid.indexOf('ig_90_')===0?'90일':'30일')+'</b></div><div><span>결제 금액</span><b>'+Number(amt).toLocaleString('ko-KR')+'원</b></div><div><span>이용 기간</span><b>'+fmt(d.until)+'까지</b></div>',true,oid);
    }).catch(function(){show('서버에 연결하지 못했습니다','잠시 뒤 이 화면을 새로고침해 주세요. 같은 결제는 중복되지 않습니다.');});
  }
  if(!W){show('결제 서버를 준비하고 있습니다','곧 열립니다.');return;}
  go();
})();
</script>
</body></html>
