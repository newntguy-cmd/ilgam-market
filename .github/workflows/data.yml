name: update-data
on:
  schedule:
    - cron: "30 22 * * *"   # 매일 한국시간 07:30
  workflow_dispatch:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/data.yml"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public data
        run: |
          curl -fsSL https://raw.githubusercontent.com/newntguy-cmd/remarket-bids/main/docs/public.json -o /tmp/p.json
          python3 -c "import json;d=json.load(open('/tmp/p.json'));assert d.get('items') is not None"
          cp /tmp/p.json data/public.json
      - name: 연락처를 서버(D1)에 올리기
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: python3 tools/push_contacts.py
        continue-on-error: true
      - name: 업체별·지역별 전용 페이지·사이트맵 만들기
        run: python3 tools/gen_pages.py
      - name: 연락처 묶음을 공개 파일에서 빼기 (번호는 서버에만 둡니다)
        run: |
          python3 - <<'PY'
          import json
          p = "data/public.json"
          d = json.load(open(p, encoding="utf-8"))
          n = len(d.pop("corp", None) or {})
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          print("공개 파일에서 뺀 연락처", n, "건")
          PY
      - name: 관심 업체 새 낙찰 이메일 알림
        env:
          FB_BOT_EMAIL: ${{ secrets.FB_BOT_EMAIL }}
          FB_BOT_PASSWORD: ${{ secrets.FB_BOT_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python3 tools/send_alerts.py
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add -A data/public.json data/about.json index.html c a sitemap.xml 'sitemap-*.xml' robots.txt
          git diff --cached --quiet || git commit -m "update data"
          git pull --rebase origin main
          git push
