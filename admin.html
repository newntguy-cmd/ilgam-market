<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>일감마켓 관리자</title>
<link rel="icon" type="image/svg+xml" href="/img/icon.svg">
<meta name="theme-color" content="#1e332f">
<link rel="stylesheet" href="/font.css?v=1">
<style>
:root{--navy:#1e332f;--gold:#c9a45c;--line:#e3e7ed;--mute:#6b788e;--bg:#f4f6f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:'Noto Sans KR',system-ui,sans-serif;word-break:keep-all}
.top{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top b{font-size:18px}.top button{background:none;border:1px solid #ffffff55;color:#fff;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:22px 16px 60px}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 16px}
.box h2{font-size:15px;margin:0 0 12px;color:var(--mute);font-weight:700}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.kp small{display:block;color:var(--mute);font-size:13px}.kp b{display:block;font-size:30px;margin-top:4px;color:var(--navy)}.kp em{font-style:normal;font-size:13px;color:var(--mute)}
.kp .hot b{color:#a8791f}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.bars span{font-size:11px;color:var(--mute);margin-top:4px}.bars em{font-style:normal;font-size:12px;font-weight:700;margin-bottom:2px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:500}
input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;width:100%;margin:0 0 8px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
code{background:var(--bg);padding:2px 6px;border-radius:4px;word-break:break-all;user-select:all}
.msg{color:#b42318;font-size:14px;min-height:20px}
[hidden]{display:none!important}
@media(max-width:600px){.kp b{font-size:26px}}
</style></head><body>
<div class="top"><b>일감마켓 관리자</b><span><button type="button" id="hm">일감마켓으로</button> <button type="button" id="lo" hidden>로그아웃</button></span></div>
<main>
<section class="box" id="login" hidden><h2>관리자 로그인</h2><input id="em" type="email" placeholder="이메일" autocomplete="email"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"><button class="btn" id="go" type="button">로그인</button><p class="msg" id="m"></p></section>
<section class="box" id="deny" hidden><h2>이 계정에는 관리자 권한이 없습니다</h2><p>아래 계정 ID를 결제 서버의 <b>ADMIN_UIDS</b> 설정에 넣으면 이 계정이 관리자가 됩니다.</p><p><code id="uid"></code></p></section>
<div id="dash" hidden></div>
<section class="box" id="tools" hidden><h2>관리 도구</h2><p style="margin:0 0 10px;font-size:14px;color:#6b788e">관리자 계정의 가입·결제·열람은 위 통계에서 제외됩니다.</p><button class="btn" id="rg" type="button">가입 선물 기록 전체 초기화</button> <span class="msg" id="rgm"></span></section>
<p class="msg" id="err"></p>
</main>
<script type="module" src="/auth.js"></script>
<script>
(function(){
var W='https://ilgam-pay.newntguy.workers.dev',$=function(i){return document.getElementById(i)};
function won(n){return Number(n).toLocaleString('ko-KR')+'원'}
function kp(l,v,s,hot){return '<div'+(hot?' class="hot"':'')+'><small>'+l+'</small><b>'+v+'</b>'+(s?'<em>'+s+'</em>':'')+'</div>'}
function draw(d){
  var u=d.users,p=d.pro,max=Math.max.apply(null,u.days.map(function(x){return x.n}).concat([1]));
  var h='<div class="kp">'+kp('전체 가입자',u.total+'명','오늘 +'+u.today+' · 7일 +'+u.d7+' · 30일 +'+u.d30)
   +kp('유료 이용 중',p.active+'명','',1)+kp('결제 건수',p.orders+'건','신규 고객가 '+p.firstPrice+'건')+kp('누적 결제액',won(p.revenue),'부가세 포함')
   +kp('가입 선물 사용',d.gift.users+'명','전화·주소 '+d.gift.opens+'곳 열람 (1인 최대 '+d.gift.limit+'곳)')+kp('매입의 신 접수',d.buy.total+'건','최근 7일 '+d.buy.d7+'건')+'</div>';
  h+='<section class="box" style="margin-top:16px"><h2>최근 14일 가입</h2><div class="bars">'+u.days.map(function(x){return '<div><em>'+(x.n||'')+'</em><i style="height:'+Math.round(x.n/max*100)+'%"></i><span>'+x.day.slice(5).replace('-','/')+'</span></div>'}).join('')+'</div></section>';
  h+='<section class="box"><h2>최근 결제</h2>'+(d.recent.length?'<table><tr><th>일시</th><th>계정</th><th>이용권</th><th>금액</th></tr>'+d.recent.map(function(r){var t=new Date(r.at);return '<tr><td>'+(t.getMonth()+1)+'/'+t.getDate()+' '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+'</td><td>'+(r.email||'-')+'</td><td>'+r.plan+'일</td><td>'+won(r.amount)+'</td></tr>'}).join('')+'</table>':'<p style="margin:0;color:#6b788e">아직 결제가 없습니다.</p>')+'</section>';
  if(d.proUsers&&d.proUsers.length)h+='<section class="box"><h2>유료 이용 중인 계정</h2><table><tr><th>계정</th><th>이용 종료일</th></tr>'+d.proUsers.map(function(x){var t=new Date(x.until);return '<tr><td>'+x.email+'</td><td>'+t.getFullYear()+'.'+(t.getMonth()+1)+'.'+t.getDate()+'</td></tr>'}).join('')+'</table></section>';
  $('dash').innerHTML=h;$('dash').hidden=false;$('tools').hidden=false;
}
function load(){
  var A=window.IGAUTH;if(!A||!A.ready)return;
  $('lo').hidden=!A.user;$('login').hidden=!!A.user;$('dash').hidden=true;$('tools').hidden=true;$('deny').hidden=true;$('err').textContent='';
  if(!A.user)return;
  A.token().then(function(t){return fetch(W+'/stats',{headers:{Authorization:'Bearer '+t}})}).then(function(r){return r.json()}).then(function(d){
    if(d.ok)draw(d);else if(d.message==='forbidden'){$('uid').textContent=d.uid||'';$('deny').hidden=false}else $('err').textContent=d.message||'통계를 불러오지 못했습니다.';
  }).catch(function(){$('err').textContent='통계를 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.'});
}
window.addEventListener('ig-auth',load);
document.addEventListener('DOMContentLoaded',function(){
  $('go').onclick=function(){$('m').textContent='';window.IGAUTH.login($('em').value.trim(),$('pw').value).catch(function(e){$('m').textContent=e.message})};
  $('lo').onclick=function(){window.IGAUTH.logout()};$('hm').onclick=function(){location.href='/'};
  $('rg').onclick=function(){if(!confirm('모든 회원의 가입 선물(전화·주소 10곳) 사용 기록을 지우고 처음부터 다시 줍니다. 계속할까요?'))return;window.IGAUTH.token().then(function(t){return fetch(W+'/reset-gift',{method:'POST',headers:{Authorization:'Bearer '+t}})}).then(function(r){return r.json()}).then(function(d){$('rgm').textContent=d.ok?'초기화했습니다 ('+d.cleared+'건 삭제)':'실패했습니다';load()}).catch(function(){$('rgm').textContent='실패했습니다'})};load();
});
})();
</script></body></html>
